name: Production maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select the server maintenance operation
        required: true
        type: choice
        default: clear-cache
        options:
          - clear-cache

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Run production maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run selected operation
        env:
          OPERATION: ${{ inputs.operation }}
          DEPLOY_EXTRACT_TOKEN: ${{ secrets.DEPLOY_EXTRACT_TOKEN }}
          DEPLOY_SITE_URL: ${{ secrets.DEPLOY_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_EXTRACT_TOKEN" ]; then
            echo "::error::Add DEPLOY_EXTRACT_TOKEN to GitHub Secrets."
            exit 1
          fi

          BASE="${DEPLOY_SITE_URL:-https://updrivehub.com}"
          BASE="${BASE%/}"

          run_endpoint() {
            local label="$1"
            shift
            local succeeded=0
            for path in "$@"; do
              local url="${BASE}${path}"
              echo "Running ${label} via ${path} ..."
              local http
              http=$(curl -sS --connect-timeout 30 --max-time 300 \
                -X POST -H "Authorization: Bearer ${DEPLOY_EXTRACT_TOKEN}" \
                -o /tmp/maintenance-response.txt -w "%{http_code}" "$url" || true)
              echo "HTTP ${http:-000}"

              python3 -c "
import sys, re, html
try:
    with open('/tmp/maintenance-response.txt', 'r', encoding='utf-8', errors='ignore') as f:
        content = f.read()
    content = re.sub(r'<script[\s\S]*?</script>', '', content, flags=re.IGNORECASE)
    content = re.sub(r'<style[\s\S]*?</style>', '', content, flags=re.IGNORECASE)
    text = re.sub(r'<[^>]+>', ' ', content)
    text = html.unescape(text)
    lines = [line.strip() for line in text.splitlines() if line.strip()]
    if lines:
        print('\n'.join(lines))
except Exception:
    pass
" 2>/dev/null || true
              echo

              if [ "$http" = "200" ]; then
                succeeded=1
                break
              fi

              if [ -n "${http:-}" ] && [ "$http" != "000" ] && [ "$http" != "404" ] && [ "$http" != "502" ] && [ "$http" != "503" ] && [ "$http" != "504" ]; then
                echo "::error::${label} endpoint ${path} returned HTTP ${http}; stopping before any fallback endpoint."
                exit 1
              fi
            done
            if [ "$succeeded" -ne 1 ]; then
              echo "::error::${label} failed. Check DEPLOY_SITE_URL, DEPLOY_EXTRACT_TOKEN, and the deployed maintenance endpoint."
              exit 1
            fi
          }

          case "$OPERATION" in
            clear-cache)
              run_endpoint "Bootstrap cache clear" /deploy-clear-cache.php
              ;;
            *)
              echo "::error::Unsupported operation: $OPERATION"
              exit 1
              ;;
          esac

name: Deploy to production (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      protocol:
        description: Override protocol (blank = use FTP_PROTOCOL secret)
        required: false
        default: ''
        type: choice
        options:
          - ''
          - ftps
          - ftp
          - ftps-legacy
          - sftp

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy application (FTP)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve FTP settings
        id: ftp
        env:
          INPUT_PROTOCOL: ${{ github.event.inputs.protocol }}
          SECRET_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          SECRET_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PUBLIC_DIR: ${{ secrets.FTP_PUBLIC_DIR }}
        run: |
          PROTO="${INPUT_PROTOCOL:-${SECRET_PROTOCOL:-ftps}}"
          case "$PROTO" in
            sftp) PORT="${SECRET_PORT:-22}" ;;
            ftps-legacy) PORT="${SECRET_PORT:-990}" ;;
            *) PORT="${SECRET_PORT:-21}" ;;
          esac
          HOST="${{ secrets.FTP_SERVER }}"
          HOST="${HOST#ftp://}"; HOST="${HOST#ftps://}"; HOST="${HOST#sftp://}"
          HOST="${HOST%%/*}"
          echo "protocol=${PROTO}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "Using ${PROTO}://${HOST}:${PORT}"

          APP_DIR="${FTP_SERVER_DIR:-/ispbilling/}"
          echo "app_dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          echo "Laravel application directory: ${APP_DIR}"

          PUBLIC_DIR="${FTP_PUBLIC_DIR:-/public_html/}"
          echo "public_dir=${PUBLIC_DIR}" >> "$GITHUB_OUTPUT"
          echo "Public web root: ${PUBLIC_DIR}"

      - name: Preflight — test server port
        run: |
          HOST="${{ steps.ftp.outputs.host }}"
          PORT="${{ steps.ftp.outputs.port }}"
          echo "Testing TCP ${HOST}:${PORT} ..."
          if timeout 25 bash -c "echo >/dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
            echo "Port is reachable from GitHub Actions."
          else
            echo "::error::Cannot reach ${HOST}:${PORT}. Your host may block GitHub IPs, or FTP_PORT / FTP_SERVER is wrong."
            exit 1
          fi

      - name: Write deploy extract token
        env:
          DEPLOY_EXTRACT_TOKEN: ${{ secrets.DEPLOY_EXTRACT_TOKEN }}
        run: |
          if [ -n "$DEPLOY_EXTRACT_TOKEN" ]; then
            mkdir -p storage/app
            echo "$DEPLOY_EXTRACT_TOKEN" > storage/app/.deploy-extract-token
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, json, openssl, pdo, tokenizer, xml, gd, zip
          coverage: none

      - name: Generate production bootstrap cache (no dev providers)
        run: |
          cp .env.example .env
          composer install --no-dev --no-scripts --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force
          php artisan package:discover --ansi
          php artisan config:clear
          rm -f bootstrap/cache/routes*.php bootstrap/cache/events.php
          grep -i pail bootstrap/cache/packages.php && exit 1 || echo "packages.php OK (no Pail)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies & build assets
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json || (echo "::error::manifest.json missing" && exit 1)
          CSS_COUNT=$(find public/build/assets -name '*.css' 2>/dev/null | wc -l)
          JS_COUNT=$(find public/build/assets -name '*.js' 2>/dev/null | wc -l)
          echo "Built ${CSS_COUNT} CSS and ${JS_COUNT} JS asset(s)"
          if [ "$CSS_COUNT" -lt 1 ] || [ "$JS_COUNT" -lt 1 ]; then
            echo "::error::public/build/assets is incomplete"
            exit 1
          fi
          ls -la public/build/assets/

      - name: Deploy application files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.ftp.outputs.port }}
          protocol: ${{ steps.ftp.outputs.protocol }}
          local-dir: ./
          server-dir: ${{ steps.ftp.outputs.app_dir }}
          state-name: ftp-deploy-sync-state.json
          timeout: 1200000
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/vendor.part.*
            **/vendor.zip
            **/vendor.manifest.json
            **/scripts/**
            **/tests/**
            **/.env
            **/.env.*
            **/.phpunit*
            **/.editorconfig
            **/.gitattributes
            **/.gitignore
            **/phpunit.xml
            **/README.md
            **/*.zip
            **/*.sql
            **/*.ps1
            **/Homestead.*
            **/.idea/**
            **/.vscode/**
            **/storage/logs/*
            **/storage/framework/cache/data/*
            **/storage/framework/sessions/*
            **/storage/framework/views/*
            **/storage/pail/**
            **/public/hot
            **/public/storage
            **/public/favicon.ico
            **/public/qrcodes/**
            **/public/qrcodes

      # Publish the protected migration fallback into public_html before invoking
      # it. The Laravel application lives in the sibling /ispbilling directory.
      - name: Deploy public web files (document root)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.ftp.outputs.port }}
          protocol: ${{ steps.ftp.outputs.protocol }}
          local-dir: ./public/
          server-dir: ${{ steps.ftp.outputs.public_dir }}
          state-name: ftp-deploy-public-state.json
          timeout: 1200000
          log-level: verbose
          exclude: |
            **/build/**
            **/favicon.ico
            **/hot
            **/storage
            **/qrcodes/**
            **/qrcodes

      - name: Run database migrations (HTTP)
        env:
          DEPLOY_EXTRACT_TOKEN: ${{ secrets.DEPLOY_EXTRACT_TOKEN }}
          DEPLOY_SITE_URL: ${{ secrets.DEPLOY_SITE_URL }}
        run: |
          if [ -z "$DEPLOY_EXTRACT_TOKEN" ]; then
            echo "::error::Add DEPLOY_EXTRACT_TOKEN to GitHub Secrets (same value as production .env)"
            exit 1
          fi
          BASE="${DEPLOY_SITE_URL:-https://updrivehub.com}"
          BASE="${BASE%/}"
          URL="${BASE}/deploy-migrate.php"
          echo "Trying protected POST ${URL} ..."
          for attempt in 1 2 3; do
            HTTP=$(curl -sS --connect-timeout 30 --max-time 300 -X POST -H "Authorization: Bearer ${DEPLOY_EXTRACT_TOKEN}" -o /tmp/deploy-migrate.out -w "%{http_code}" "$URL" || echo "000")
            echo "HTTP ${HTTP}"
            cat /tmp/deploy-migrate.out || true
            echo ""
            if [ "$HTTP" = "200" ]; then
              echo "Migrations OK."
              exit 0
            fi

            # A migration response (500) means Laravel ran and reported an
            # actual failure. Never fall back to /api/deploy/migrate: that
            # endpoint can be served by stale Laravel code and rerun the old
            # migration against production.
            if [ "$HTTP" != "000" ] && [ "$HTTP" != "404" ] && [ "$HTTP" != "502" ] && [ "$HTTP" != "503" ] && [ "$HTTP" != "504" ]; then
              echo "::error::Migration endpoint returned HTTP ${HTTP}; stopping without invoking a legacy endpoint."
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Attempt ${attempt} could not reach the migration helper; retrying in 15s..."
              sleep 15
            fi
          done

          echo "::error::Could not reach /deploy-migrate.php after 3 attempts. Verify FTP_PUBLIC_DIR and DEPLOY_SITE_URL."
          exit 1

      - name: Deploy public build assets (document root)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.ftp.outputs.port }}
          protocol: ${{ steps.ftp.outputs.protocol }}
          local-dir: ./public/build/
          server-dir: ${{ steps.ftp.outputs.public_dir }}build/
          state-name: ftp-deploy-public-build-state.json
          timeout: 1200000
          log-level: verbose

      - name: Sync public files on server (HTTP)
        env:
          DEPLOY_EXTRACT_TOKEN: ${{ secrets.DEPLOY_EXTRACT_TOKEN }}
          DEPLOY_SITE_URL: ${{ secrets.DEPLOY_SITE_URL }}
        run: |
          if [ -z "$DEPLOY_EXTRACT_TOKEN" ]; then
            echo "::error::Add DEPLOY_EXTRACT_TOKEN to GitHub Secrets (same value as production .env)"
            exit 1
          fi
          BASE="${DEPLOY_SITE_URL:-https://updrivehub.com}"
          BASE="${BASE%/}"
          sync_ok=0
          for path in /api/deploy/sync-public /deploy-sync-public.php; do
            URL="${BASE}${path}"
            echo "Trying protected POST ${URL} ..."
            for attempt in 1 2 3; do
              HTTP=$(curl -sS --connect-timeout 30 --max-time 120 -X POST -H "Authorization: Bearer ${DEPLOY_EXTRACT_TOKEN}" -o /tmp/deploy-sync.out -w "%{http_code}" "$URL" || echo "000")
              echo "HTTP ${HTTP}"
              cat /tmp/deploy-sync.out || true
              echo ""
              if [ "$HTTP" = "200" ]; then
                sync_ok=1
                break 2
              fi
              echo "Attempt ${attempt} failed, retrying in 15s..."
              sleep 15
            done
          done
          if [ "$sync_ok" -ne 1 ]; then
            echo "::error::HTTP public sync failed. Ensure DEPLOY_EXTRACT_TOKEN is in production .env and GitHub Secrets."
            exit 1
          fi
          echo "Public sync OK."
